# 检索层用例：问句是中文、语料是英文，这是真实用法（跨语种召回）。
#
# 期望写成「出处 + 内容里必须出现的原话」，不锁相似度数值、不锁片段顺序：
# 换向量模型或调召回只要还能把这一段取回来，就该通过。top_k 与线上检索的
# 取值保持一致，否则评估的就不是用户实际看到的结果。
#
# expected_fail 标的是「期望合理、当前确实取不到」的已知缺口：照常计入 MRR，
# 但不把整轮判成失败；等它真能命中了，报告会提醒把标记去掉。
#
# 用例数随语料增长 —— 语料只有一份文档时，前 5 名几乎覆盖全部片段，通过率参考价值有限。
#
# 每条用例的字段：
#   name          用例名，报告与基线都按它定位，必须唯一
#   query         送进检索的原始问句，就是用户会打的那句话
#   expect_doc    期望命中的文档，匹配片段的文件名或文档标题
#   expect_any    期望在片段正文里出现的原话，命中任意一条即可（可写多条）
#   top_k         取前多少名参与判定，与线上检索一致才有意义
#   expected_fail 是否属于已知缺口，缺省 false
#   note          备注，只在「已知缺口」段落里展示，说明当前为什么取不到
#
# expect_doc 与 expect_any 至少要写一个，只写问题不写期望无法判定。

# 原生代币用途：验证正文块的召回归属，参考标题为 Role of BERA。
[[case]]
name = "bera-role"
query = "BERA 这个代币是干什么用的"
expect_doc = "bera.pdf"
expect_any = ["gas token"]
top_k = 5
note = "原生代币用途；正文块，标题为 Role of BERA"

# 质押产物：验证「标题里才有的专有名词」能不能被问句取回。
[[case]]
name = "bera-staking"
query = "质押 BERA 会得到什么"
expect_doc = "bera.pdf"
expect_any = ["sWBERA"]
top_k = 5
note = "质押产物；标题为 Role of BERA > Stake BERA for sWBERA"

# 表格块：向量化时把标题拼进去才排得进前 k，这条专盯表格片的召回。
[[case]]
name = "bera-total-supply"
query = "BERA 的总发行量是多少"
expect_doc = "bera.pdf"
expect_any = ["500,000,000"]
top_k = 5
note = "总量；表格块，靠标题拼进向量才排得前"

# 与总量同页：验证同一页的两个不同数字不会被互相挤掉。
[[case]]
name = "bera-allocation"
query = "BERA 代币是怎么分配的"
expect_doc = "bera.pdf"
expect_any = ["core contributors"]
top_k = 5
note = "分配明细；与总量同页，用来验证两者不会被互相挤掉"

# 已知缺口：中文自然问法取不到，换英文问句能排第 1，属中英概念对齐问题。
[[case]]
name = "bera-vesting"
query = "BERA 有没有锁定期和解锁安排"
expect_doc = "bera.pdf"
expect_any = ["Cliff: 1 year"]
top_k = 5
expected_fail = true
note = "跨语种语义缺口：中文自然问法排第 7~8，换成英文问句或带上 cliff 则排第 1。"


# =========what-is-berachain.md========
