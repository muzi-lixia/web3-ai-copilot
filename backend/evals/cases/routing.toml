# 路由层用例：这一轮该调哪个工具，模型选得对不对。
#
# 断言只落在**首轮的工具选择**上，不看措辞、不看参数 —— 参数填得对不对由各工具
# 自己的校验兜住，不在这一层量。三条期望至少要写一条：
#   expect_tools     首轮必须调用其中至少一个（一个问题有一个工具能答就不必全调）
#   forbid_tools     首轮不允许出现其中任何一个
#   expect_no_tools  首轮不该调用任何工具（问候、超出只读范围这类）
#
# expect_no_tools 与 expect_tools 互斥：一个要求不调、一个要求必调，写在一起无从判定。
#
# max_calls 卡的是另一件事 —— 过度调用。只写 forbid_tools 只能拦住点名的几个工具，
# 多调一个「既不在期望、也不在禁区」的工具照样算过，写上限才拦得住。
# 一个工具一次就能答完的问题写 1：多调的那次要么白花一次取数，要么就是选错了方向。
#
# 工具名必须是注册表里的名字（app/agent/tools/__init__.py），写错会在跑之前报错，
# 不表现成一条用例未通过。工具职责写在各自的 description 里，这里的注释只讲
# 「这条用例为什么在这里」。
#
# 这一层用真模型判，所以每条用例的结果带随机性：它是统计量，不是一次一锤的开关。
#
# 每条用例的字段：
#   name            用例名，报告与基线都按它定位，必须唯一
#   history         本轮之前的对话，[{role="user", content="…"}, {role="assistant", content="…"}]
#   query           用户这一轮的原话
#   expect_tools    首轮必须调用其中至少一个（可写多条）
#   forbid_tools    首轮不允许调用的工具（可写多条）
#   expect_no_tools 首轮不该调用任何工具，缺省 false
#   max_calls       首轮调用条数的上限，缺省不限制
#   expected_fail   是否属于已知缺口，缺省 false
#   note            备注，只在「已知缺口」与未通过段落里展示

# 本轮问题里的「它」指的是上一轮谈过的 sWBERA，问的是文档里写的解锁安排。
# 这条复现的就是「谈过 BERA 之后，问周期被答成查余额」那次误路由。
[[case]]
name = "route-knowledge-after-asset-turn"
history = [
    { role = "user", content = "BERA 质押能拿到什么" },
    { role = "assistant", content = "质押 BERA 会得到 sWBERA，它按 ERC-4626 表示你在质押金库里的份额。" },
]
query = "那它的解锁周期是多久"
expect_tools = ["search_docs"]
forbid_tools = ["get_my_token_balance", "get_my_balance_overview", "get_token_price"]
max_calls = 1
note = "承接上一轮的资产话题，问的却是文档里的解锁安排"

# 概念性问题：两个名字的区别写在文档里，没有可查的数值。
[[case]]
name = "route-knowledge-concept"
query = "sWBERA 和 WBERA 有什么区别"
expect_tools = ["search_docs"]
forbid_tools = ["get_my_token_balance", "get_my_balance_overview", "get_token_price"]
max_calls = 1
note = "概念差异；余额工具的 description 里满是 BERA 与 WBERA 的规则，最容易被拉过去"

# 参数含义：答案是一段说明，不是数值。
[[case]]
name = "route-knowledge-parameter"
query = "Reward Vault 的 rewardsDuration 决定什么"
expect_tools = ["search_docs"]
forbid_tools = ["get_my_token_balance", "get_my_balance_overview", "get_token_price"]
max_calls = 1
note = "参数含义，文档里才有依据"

# 操作步骤：问的是「怎么做」，不是「我有什么」。
[[case]]
name = "route-knowledge-howto"
history = [
    { role = "user", content = "我把 BERA 质押进去了" },
    { role = "assistant", content = "质押后你会持有 sWBERA，它代表金库里的份额。" },
]
query = "想取出来要怎么做"
expect_tools = ["search_docs"]
forbid_tools = ["get_my_token_balance", "get_my_balance_overview"]
max_calls = 1
note = "操作指南类；紧接资产话题之后问步骤"

# 规则上限：同样是文档里写好的安排。
[[case]]
name = "route-knowledge-limit"
query = "激励市场的白名单最多能加几个代币"
expect_tools = ["search_docs"]
forbid_tools = ["get_my_balance_overview", "get_token_price"]
max_calls = 1
note = "规则上限，答案在文档里"

# 未点名币种的整体持仓：该走概览，不是单币余额、也不是行情。
[[case]]
name = "route-balance-overview"
query = "我一共持有多少资产"
expect_tools = ["get_my_balance_overview"]
forbid_tools = ["get_my_token_balance", "get_token_price", "search_docs"]
max_calls = 1
note = "整体持仓概览"

# 点名币种的余额：单币查询，不是概览。
[[case]]
name = "route-balance-token"
query = "我有多少 HONEY"
expect_tools = ["get_my_token_balance"]
forbid_tools = ["get_my_balance_overview", "get_token_price", "search_docs"]
max_calls = 1
note = "点名一个币种"

# 与第一条镜像：上一轮是知识话题，这一轮问的是自己有多少 —— 该切到余额，
# 不能顺着上一轮继续检索文档。
[[case]]
name = "route-balance-after-knowledge-turn"
history = [
    { role = "user", content = "Reward Vault 是怎么发奖励的" },
    { role = "assistant", content = "奖励按 rewardsDuration 或 target rate 两种模式之一下发。" },
]
query = "那我的 WBERA 余额还有多少"
expect_tools = ["get_my_token_balance"]
forbid_tools = ["get_my_balance_overview", "search_docs"]
max_calls = 1
note = "话题从知识切回本人持仓"

# 公开行情：问价格，不是问自己有多少。
[[case]]
name = "route-price-plain"
query = "BERA 现在多少钱"
expect_tools = ["get_token_price"]
forbid_tools = ["get_my_token_balance", "get_my_balance_overview", "search_docs"]
max_calls = 1
note = "公开行情；没提「我的」"

# 上一轮在讲奖励规则，这一轮问价：该切行情，不要继续检索文档。
[[case]]
name = "route-price-after-knowledge-turn"
history = [
    { role = "user", content = "Reward Vault 的奖励是每天发吗" },
    { role = "assistant", content = "发放节奏由 rewardsDuration 与 target rate 决定，不是按固定日历发。" },
]
query = "那 BERA 现在什么价"
expect_tools = ["get_token_price"]
forbid_tools = ["get_my_balance_overview", "search_docs"]
max_calls = 1
note = "话题从知识切到公开行情"

# 平台配置类问题：问支持范围，不是持仓也不是单币价。
[[case]]
name = "route-chain-list"
query = "平台支持哪些链和代币"
expect_tools = ["get_chain_info"]
forbid_tools = ["get_my_balance_overview", "search_docs"]
max_calls = 1
note = "公开配置查询"

# 问候不该触发取数：没有任何要查的东西。
[[case]]
name = "route-greeting"
query = "你好"
expect_no_tools = true
note = "问候，直接回应即可"

# 超出只读范围的问题：说明范围即可，没有工具能回答它。
[[case]]
name = "route-out-of-scope"
query = "今天上海的天气怎么样"
expect_no_tools = true
note = "超出只读范围，不该为了显得在干活而随便调工具"
