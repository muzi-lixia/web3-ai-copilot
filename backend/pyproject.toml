[project]
name = "web3-ai-copilot-backend"
version = "0.1.0"
description = "Web3 AI Copilot 后端：链上数据 + 行情 + Agent + RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "web3>=7.6",
    "openai>=1.55",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
# 100 对常量表里的合约地址行偏紧（地址本身 42 字符），强行拆分会让
# 「地址」与「参数」分居两行、降低可读性，故放宽到 110。
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
