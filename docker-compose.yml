# 本地持久化服务：只启动 PostgreSQL，后端与 Ollama 仍按原方式运行。
services:
  postgres:
    image: postgres:16.13
    # 仅绑定本机，避免开发默认口令对应的数据库暴露到局域网或公网。
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: copilot_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_dev_admin}
      POSTGRES_DB: web3copilot
    # 独立命名卷让数据在容器重建后保留；down -v 会删除数据，应谨慎使用。
    volumes:
      - copilot_pg_data:/var/lib/postgresql/data
    # 健康检查只确认数据库能接受连接，表结构仍需 init_chat_db.py 执行迁移。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_admin -d web3copilot"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  copilot_pg_data:
